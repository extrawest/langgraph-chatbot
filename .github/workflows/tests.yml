name: tests

on:
  push:
    branches: [main]
  pull_request:
  # the release workflow runs this same suite before it ships a tag
  workflow_call:

# A new push to the same branch cancels the run still going for the old one.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pipx install poetry

      # Keep the venv inside the repo so it can be cached by poetry.lock's hash.
      - name: Cache the virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py314-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        env:
          POETRY_VIRTUALENVS_IN_PROJECT: "true"
        run: poetry install --no-interaction

      # No secrets and no service containers: tests/conftest.py disables load_dotenv,
      # swaps Postgres for in-memory SQLite and Qdrant for its local mode.
      - name: Run tests
        run: poetry run pytest --cov --cov-report=term-missing
