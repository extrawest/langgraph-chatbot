[project]
name = "langgraph-chatbot"
version = "0.1.0"
description = ""
authors = [
    {name = "roman-ovsepian-ew",email = "roman.ovsepian@extrawest.com"}
]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi (>=0.146.0,<0.147.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "sqlalchemy[asyncio] (>=2.1.5,<3.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "pydantic-settings (>=2.16.0,<3.0.0)",
    "pyjwt (>=2.15.1,<3.0.0)",
    "pwdlib[argon2] (>=0.3.1,<0.4.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "pydantic[email] (>=2.14.1,<3.0.0)",
    "gradio (>=6.30.0,<7.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "langgraph (>=1.2.16,<2.0.0)",
    "langchain[mcp] (>=1.4.8,<2.0.0)",
    "langchain-google-genai (>=4.4.2,<5.0.0)",
    "langchain-openai (>=1.7.2,<2.0.0)",
    "qdrant-client (>=1.20.0,<2.0.0)",
    "mem0ai (>=2.2.1,<3.0.0)",
    "livekit-agents (>=1.8.10,<2.0.0)",
    "livekit-plugins-elevenlabs (>=1.8.10,<2.0.0)",
    "livekit-plugins-silero (>=1.8.10,<2.0.0)",
    "livekit-plugins-langchain (>=1.8.10,<2.0.0)",
    "tavily-python (>=0.8.5,<0.9.0)",
    "firecrawl-py (>=4.54.0,<5.0.0)",
]

[tool.poetry]
packages = [{include = "langgraph_chatbot", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-asyncio (>=1.4.1.post1,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
filterwarnings = [
    # Qdrant local (in-memory) mode ignores payload indexes and says so on every call
    "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
]

[tool.coverage.run]
source = ["langgraph_chatbot"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:"]
