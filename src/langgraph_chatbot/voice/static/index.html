<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voice</title>
  <style>
    :root {
      color-scheme: light dark;
      --surface: #f4f4f5; --text: #18181b; --muted: #71717a;
      --accent: #2563eb; --danger: #dc2626; --border: #e4e4e7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #1c1c1f; --text: #f4f4f5; --muted: #a1a1aa;
        --accent: #3b82f6; --danger: #ef4444; --border: #2e2e33;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; color: var(--text);
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }

    /* one compact row: status | live caption | controls */
    .bar {
      display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 6px 10px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    }
    .status { display: flex; align-items: center; gap: 8px; flex: none; color: var(--muted); white-space: nowrap; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
    .dot.live { background: #22c55e; }
    .dot.thinking { background: #f59e0b; }
    .dot.speaking { background: var(--accent); }

    /* what the mic hears right now; the full transcript lives in the main chat */
    #caption {
      flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      color: var(--muted);
    }
    #caption.interim { font-style: italic; }
    #caption.error { color: var(--danger); }

    button {
      flex: none; height: 34px; min-width: 34px; padding: 0 12px; border-radius: 17px;
      border: 1px solid var(--border); background: transparent; color: var(--text);
      font: inherit; cursor: pointer;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<div class="bar">
  <div class="status"><span id="dot" class="dot"></span><span id="status">не подключено</span></div>
  <div id="caption"></div>

  <button id="sound" hidden title="Браузер заблокировал звук">🔊 Включить звук</button>
  <button id="start" class="primary">Начать</button>
  <button id="mute" hidden title="Микрофон" aria-label="Микрофон">🎤</button>
  <button id="end" class="danger" hidden title="Завершить" aria-label="Завершить">✕</button>
</div>
<div id="audio" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.20.2/dist/livekit-client.umd.min.js"></script>
<script>
  "use strict";

  // --- Auth + chat come from the URL fragment (never sent to a server / logged) ---
  const params = new URLSearchParams(location.hash.slice(1));
  const accessToken = params.get("token");
  const chatId = params.get("chat_id");   // empty = new chat
  history.replaceState(null, "", location.pathname);   // wipe the token from the address bar

  const $ = (id) => document.getElementById(id);
  const startBtn = $("start"), muteBtn = $("mute"), endBtn = $("end"), soundBtn = $("sound");
  const captionEl = $("caption");

  const { Room, RoomEvent, Track } = LivekitClient;
  let room = null;
  let micEnabled = true;

  const IDLE_HINT = "Говорите: реплики появятся в чате";
  const STATE_LABELS = {
    connecting: "подключение…", "pre-connect-buffering": "подключение…", initializing: "агент запускается…",
    idle: "ожидание", listening: "слушает", thinking: "думает", speaking: "говорит",
    disconnected: "звонок завершён", failed: "ошибка",
  };

  function setStatus(text, kind) {
    $("status").textContent = text;
    $("dot").className = "dot" + (kind ? " " + kind : "");
  }

  // kind: "" | "interim" | "error"
  function setCaption(text, kind = "") {
    captionEl.textContent = text || "";
    captionEl.className = kind;
    captionEl.title = text || "";
  }

  async function fetchVoiceToken() {
    const response = await fetch("/voice/token", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${accessToken}` },
      body: JSON.stringify({ chat_id: chatId || null }),
    });
    if (!response.ok) {
      const messages = {
        401: "Сессия истекла: войдите заново в приложении",
        404: "Чат не найден",
        503: "Голосовой режим не настроен на сервере",
      };
      throw new Error(messages[response.status] || `Ошибка сервера (${response.status})`);
    }
    return response.json();
  }

  // idle = can start a call; live = in a call
  function showControls(live) {
    startBtn.hidden = live;
    muteBtn.hidden = !live;
    endBtn.hidden = !live;
    if (!live) soundBtn.hidden = true;
  }

  function resetUi() {
    showControls(false);
    startBtn.disabled = !accessToken;
    micEnabled = true;
    muteBtn.textContent = "🎤";
    $("audio").replaceChildren();
    room = null;
  }

  async function startCall() {
    startBtn.disabled = true;
    setCaption("");
    setStatus("подключение…");
    try {
      const { token, url } = await fetchVoiceToken();

      room = new Room();

      room.on(RoomEvent.TrackSubscribed, (track) => {
        if (track.kind === Track.Kind.Audio) $("audio").appendChild(track.attach());
      });
      room.on(RoomEvent.TrackUnsubscribed, (track) => track.detach().forEach((el) => el.remove()));

      // browsers may block audio until a click inside this frame: offer a button then
      room.on(RoomEvent.AudioPlaybackStatusChanged, () => { soundBtn.hidden = room.canPlaybackAudio; });

      room.on(RoomEvent.ParticipantAttributesChanged, (changed) => {
        const state = changed["lk.agent.state"];
        if (state === undefined) return;
        const kind = state === "speaking" ? "speaking" : state === "thinking" ? "thinking"
                   : state === "listening" || state === "idle" ? "live" : "";
        setStatus(STATE_LABELS[state] || state, kind);
      });

      room.on(RoomEvent.Disconnected, () => { setStatus("звонок завершён"); resetUi(); });

      // Transcriptions arrive as text streams. Only the user's own words are shown here
      // (a live "what I hear" caption); the full dialogue appears in the main chat.
      room.registerTextStreamHandler("lk.transcription", async (reader, participantInfo) => {
        let text;
        try { text = await reader.readAll(); } catch (err) { console.error(err); return; }
        const attrs = reader.info.attributes ?? {};
        if (!attrs["lk.transcribed_track_id"]) return;
        if (participantInfo.identity !== room.localParticipant.identity) return;
        setCaption(text, attrs["lk.transcription_final"] === "true" ? "" : "interim");
      });

      await room.connect(url, token);
      await room.startAudio().catch(() => {});   // may need a click: see the sound button
      await room.localParticipant.setMicrophoneEnabled(true);

      showControls(true);
      setCaption(IDLE_HINT);
      setStatus("ожидание агента…", "live");
    } catch (err) {
      console.error(err);
      setCaption(err.message || "Не удалось начать звонок", "error");
      setStatus("не подключено");
      room?.disconnect();
      resetUi();
    }
  }

  async function toggleMute() {
    if (!room) return;
    micEnabled = !micEnabled;
    await room.localParticipant.setMicrophoneEnabled(micEnabled);
    muteBtn.textContent = micEnabled ? "🎤" : "🔇";
    muteBtn.title = micEnabled ? "Выключить микрофон" : "Включить микрофон";
  }

  startBtn.addEventListener("click", startCall);
  muteBtn.addEventListener("click", toggleMute);
  endBtn.addEventListener("click", () => {
    room?.disconnect();
    // tell the host page to close voice mode entirely (panel, polling); carries no secrets
    window.parent.postMessage({ type: "voice-closed" }, "*");
  });
  soundBtn.addEventListener("click", () => room?.startAudio());
  window.addEventListener("beforeunload", () => room?.disconnect());
  window.addEventListener("pagehide", () => room?.disconnect());   // iframe removed / tab closed

  if (!accessToken) {
    setCaption("Нет токена авторизации: откройте страницу из приложения", "error");
    startBtn.disabled = true;
  } else {
    // the frame is opened by a click in the main app, so start right away
    startCall();
  }
</script>
</body>
</html>
